<svg viewBox="0 0 1760 326" width="1760" height="326" xmlns="http://www.w3.org/2000/svg" role="img"
  xmlns:c2pa="http://c2pa.org/manifest">
  <title id="ttl">Discomfort by condition</title>
  <desc id="dsc">APA-7 formatted table of means, standard deviations and participant-level 95%
    confidence intervals for discomfort in each of the four experimental conditions.</desc>

  <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2.5; }
        .thin { stroke-width: 1.5; }
    </style>

  <rect x="0" y="0" width="1760" height="326" rx="32" class="bg" stroke-width="0.002" />

  <!-- Top rule -->
  <line x1="36" y1="36" x2="1724" y2="36" class="thick" />

  <!-- Group headers -->
  <text x="660" y="76" class="center bold">No oddity</text>
  <text x="1384" y="76" class="center bold">Oddity</text>
  <line x1="360" y1="96" x2="1020" y2="96" class="thin" />
  <line x1="1080" y1="96" x2="1704" y2="96" class="thin" />

  <!-- Sub-column headers -->
  <text x="36" y="136" class="left bold">Activity (noise)</text>
  <text x="436" y="136" class="center bold italic">M</text>
  <text x="624" y="136" class="center bold italic">SD</text>
  <text x="860" y="136" class="center bold">95% CI</text>
  <text x="1160" y="136" class="center bold italic">M</text>
  <text x="1348" y="136" class="center bold italic">SD</text>
  <text x="1584" y="136" class="center bold">95% CI</text>
  <line x1="36" y1="156" x2="1724" y2="156" class="thick" />

  <!-- Rows: Discomfort -->
  <text x="36" y="212" class="left">Low</text>
  <text x="436" y="212" class="center">1.47</text>
  <text x="624" y="212" class="center">0.83</text>
  <text x="860" y="212" class="center">[1.39, 1.56]</text>
  <text x="1160" y="212" class="center">2.17</text>
  <text x="1348" y="212" class="center">1.10</text>
  <text x="1584" y="212" class="center">[2.02, 2.31]</text>
  <text x="36" y="268" class="left">High</text>
  <text x="436" y="268" class="center">1.66</text>
  <text x="624" y="268" class="center">0.89</text>
  <text x="860" y="268" class="center">[1.55, 1.78]</text>
  <text x="1160" y="268" class="center">2.51</text>
  <text x="1348" y="268" class="center">1.14</text>
  <text x="1584" y="268" class="center">[2.37, 2.66]</text>

  <!-- Bottom rule -->
  <line x1="36" y1="290" x2="1724" y2="290" class="thick" />
</svg>