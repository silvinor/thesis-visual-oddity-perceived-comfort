<svg viewBox="0 0 920 246" width="920" height="246" xmlns="http://www.w3.org/2000/svg" role="img">
  <title id="ttl">Experimental conditions table</title>
  <desc id="dsc">APA-7 formatted 2x2 table of experimental conditions crossing noise level (low,
    high) with stimulus type (normal, oddity).</desc>

  <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2.5; }
        .thin { stroke-width: 1.5; }
    </style>

    <rect x="0" y="0" width="920" height="246" rx="32" stroke-width="0.002" class="bg" />

    <!-- Top rule: 28pt (~36px) from top edge -->
    <line x1="36" y1="36" x2="884" y2="36" class="thick" />

    <!-- Column headers -->
    <text x="360" y="76" class="center bold">Low Noise</text>
    <text x="680" y="76" class="center bold">High Noise</text>

    <!-- Header rule -->
    <line x1="36" y1="96" x2="884" y2="96" class="thin" />

    <!-- Row 1: Normal -->
    <text x="36" y="134" class="left bold">Normal</text>
    <text x="360" y="134" class="center">Low noise, normal</text>
    <text x="680" y="134" class="center">High noise, normal</text>

    <!-- Row 2: Oddity -->
    <text x="36" y="190" class="left bold">Oddity</text>
    <text x="360" y="190" class="center">Low noise + oddity</text>
    <text x="680" y="190" class="center">High noise + oddity</text>

    <!-- Bottom rule: 28pt (~36px) from bottom edge -->
    <line x1="36" y1="208" x2="884" y2="208" class="thick" />
</svg>
