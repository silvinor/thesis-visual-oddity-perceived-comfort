<svg viewBox="0 0 674 336" width="674" height="336" xmlns="http://www.w3.org/2000/svg">
    <title id="ttl">Mediation paths from oddity to discomfort</title>

    <style>
        rect, line, polygon, .s0 { stroke: #111; }
        polygon, text, .f0 { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon, .s0 { stroke: #ddd; }
            polygon, text, .f0 { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        rect {
            fill: none;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2; }
        .thin { stroke-width: 0.75; }
        .dashed { stroke-dasharray: 8 8; }
        .dotted { stroke-dasharray: 2 4.5; }

        .fn { fill: none; }
        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" style="fill: context-fill; stroke: context-stroke" />
        </marker>
        <!-- same arrowhead, filled from the stroke colour (the a×b path itself has no fill) -->
        <marker id="arrow-axb" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <polygon points="0,0 10,5 0,10" style="fill: context-stroke; stroke: context-stroke" />
        </marker>
    </defs>

    <rect x="0" y="0" width="674" height="336" rx="16" stroke-width="0.001" class="bg" />

    <!-- boxes -->
    <g class="thin">
        <rect x="259" y="18" width="156" height="58" rx="8" />
        <rect x="18" y="260" width="156" height="58" rx="8" />
        <rect x="500" y="260" width="156" height="58" rx="8" />
    </g>

    <!-- Lines -->
    <g class="thick">
        <line x1="96" y1="256" x2="199.2" y2="142" class="s8 f8" />
        <line x1="235.5" y1="102" x2="259" y2="76" marker-end="url(#arrow)" class="s8 f8" />
        <line x1="415" y1="76" x2="438.5" y2="102" class="s8 f8" />
        <line x1="474.8" y1="142" x2="578" y2="256" marker-end="url(#arrow)" class="s8 f8" />
        <line x1="178" y1="290" x2="496" y2="290" marker-end="url(#arrow)" class="dashed s3 f3" />
        <!-- indirect effect (a×b): dotted and thinner, so it reads as the product of a and b rather than a third regression path -->
        <path d="M 130 256 C 152 185, 200 145, 337 145 C 474 145, 522 185, 544 256" marker-end="url(#arrow)" class="dotted s8 fn" />
    </g>

    <g>
        <!-- In box text -->
        <text x="337" y="43" class="center bold"> Unexpectedness </text>
        <text x="337" y="60" class="center small"> higher = more unexpected </text>
        <text x="96" y="285" class="center bold"> Oddity </text>
        <text x="96" y="302" class="center small"> present vs absent </text>
        <text x="578" y="285" class="center bold"> Discomfort </text>
        <text x="578" y="302" class="center small"> higher = more discomfort </text>

        <!-- Arrow text -->
        <text x="229" y="118" class="center bold f8"><tspan class="italic">a</tspan>: <tspan class="italic">B</tspan> = +2.821, <tspan class="italic">p</tspan> &lt; .001 </text>
        <text x="229" y="136" class="center italic small f8">more unexpected</text>
        <text x="445" y="118" class="center bold f8"><tspan class="italic">b</tspan>: <tspan class="italic">B</tspan> = +0.412, <tspan class="italic">p</tspan> &lt; .001 </text>
        <text x="445" y="136" class="center italic small f8">more discomfort</text>
        
        <text x="337" y="280" class="center bold f3"><tspan class="italic">c&#8242;</tspan>: <tspan class="italic">B</tspan> = &#8722;0.391, <tspan class="italic">p</tspan> &lt; .001 </text>
        <text x="337" y="306" class="center small f3"> controlling for perceived unexpectedness </text>
        <text x="337" y="320" class="center small italic f3"> less discomfort </text>
    </g>

    <!-- Descriptives -->
    <g>
        <text x="337" y="170" class="center f8">
            <tspan> indirect </tspan>
            <tspan class=""> (<tspan class="italic">a&#x00D7;b</tspan>) = +1.162 </tspan>
        </text>
        <text x="337" y="190" class="center f8">
            <tspan class="f0"> + </tspan>
            <tspan class="f3"> direct </tspan>
            <tspan class="f3"> (<tspan class="italic">c&#8242;</tspan>) = &#8722;0.391 </tspan>
        </text>
        <text x="337" y="210" class="center f8">
            <tspan class="f0"> &#8594; </tspan>
            <tspan class="bold"> total </tspan>
            <tspan class="bold"> (<tspan class="italic">c</tspan>) = +0.772, <tspan class="italic">p</tspan> &lt; .001 </tspan>
        </text>
        <text x="337" y="230" class="center small"> 
            <tspan> indirect </tspan>
            <tspan class="bold"> (<tspan class="italic">a&#x00D7;b</tspan>) </tspan>
            <tspan> @ </tspan>
            <tspan> 95% Bootstrap CI [1.052, 1.275] </tspan>
        </text>
    </g>
</svg>
