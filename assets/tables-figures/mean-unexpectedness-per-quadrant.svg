<svg viewBox="46 34 1170 818" width="1170" height="818" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Mean unexpectedness by oddity condition and activity level</title>
    <desc id="dsc">Grouped bar chart of mean unexpectedness rating for No oddity vs Oddity conditions, split by Low vs High activity, with 95% CI error bars.</desc>

    <defs>
        <pattern id="dots" class="s3" width="8" height="8" patternUnits="userSpaceOnUse" stroke-width="0">
            <rect x="0" y="0" width="8" height="8" />
            <circle cx="2" cy="2" r=".02" stroke-width="2" />
            <circle cx="6" cy="6" r=".02" stroke-width="2" />
        </pattern>
        <pattern id="hatch" class="sA" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)" stroke-width="0">
            <rect x="0" y="0" width="8" height="8" />
            <line x1="0" y1="0" x2="8" y2="0" stroke-width="4" />
        </pattern>
    </defs>
    
    <style>
        pattern line,
        pattern circle { 
            stroke: inherit;
        }
        pattern rect {
            fill: #FFF;
        }
        line.invert {
            stroke: #FFF;
        }

        rect, line, polygon, path { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            pattern rect {
                fill: #111;
            }
            line.invert {
                stroke: #111;
            }

            rect, line, polygon, path { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2.5; }
        .thin { stroke-width: 1.5; }

        .bar1 { fill: url(#dots); }
        .bar2 { fill: url(#hatch); }
        .grid { stroke-width: 1; opacity: 0.15; }
        .axis { stroke-width: 2.5; }
        .tick { stroke-width: 1.5; }
        .err_halo { stroke-width: 9; }
        .err_line { stroke-width: 3; }

        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
        .sX { stroke: #777; } .fX { fill: #777; }
    </style>

    <rect x="46" y="34" width="1170" height="818" rx="32" class="bg" stroke-width="0.002" />

    <!-- Gridlines -->
    <line x1="180" y1="680" x2="1180" y2="680" class="grid" />
    <line x1="180" y1="600" x2="1180" y2="600" class="grid" />
    <line x1="180" y1="520" x2="1180" y2="520" class="grid" />
    <line x1="180" y1="440" x2="1180" y2="440" class="grid" />
    <line x1="180" y1="360" x2="1180" y2="360" class="grid" />
    <line x1="180" y1="280" x2="1180" y2="280" class="grid" />
    <line x1="180" y1="200" x2="1180" y2="200" class="grid" />
    <line x1="180" y1="120" x2="1180" y2="120" class="grid" />

    <!-- Y ticks + labels -->
    <line x1="170" y1="760" x2="180" y2="760" class="tick" />
    <line x1="170" y1="680" x2="180" y2="680" class="tick" />
    <line x1="170" y1="600" x2="180" y2="600" class="tick" />
    <line x1="170" y1="520" x2="180" y2="520" class="tick" />
    <line x1="170" y1="440" x2="180" y2="440" class="tick" />
    <line x1="170" y1="360" x2="180" y2="360" class="tick" />
    <line x1="170" y1="280" x2="180" y2="280" class="tick" />
    <line x1="170" y1="200" x2="180" y2="200" class="tick" />
    <line x1="170" y1="120"  x2="180" y2="120"  class="tick" />
    <text x="164" y="768" class="right">1.0</text>
    <text x="164" y="688" class="right">1.5</text>
    <text x="164" y="608" class="right">2.0</text>
    <text x="164" y="528" class="right">2.5</text>
    <text x="164" y="448" class="right">3.0</text>
    <text x="164" y="368" class="right">3.5</text>
    <text x="164" y="288" class="right">4.0</text>
    <text x="164" y="208" class="right">4.5</text>
    <text x="164" y="128"  class="right">5.0</text>

    <text class="center" transform="rotate(-90 96 440)" x="96" y="440">Mean unexpectedness rating</text>

    <!-- Bars: No oddity (band center 215) -->
    <path d="M252,760 L252,688 Q252,676 264,676 L416,676 Q428,676 428,688 L428,760 Z" class="bar1 s3" />
    <path d="M432,760 L432,706 Q432,694 444,694 L596,694 Q608,694 608,706 L608,760 Z" class="bar2 sA" />

    <!-- Bars: Oddity (band center 465) -->
    <path d="M752,760 L752,256 Q752,244 764,244 L916,244 Q928,244 928,256 L928,760 Z" class="bar1 s3" />
    <path d="M932,760 L932,236 Q932,224 944,224 L1096,224 Q1108,224 1108,236 L1108,760 Z" class="bar2 sA" />

    <!-- Axes -->
    <line x1="180" y1="120" x2="180" y2="760" class="axis" />
    <line x1="180" y1="760" x2="1180" y2="760" class="axis" />

    <!-- Error bars (95% CI), white halo first so they read against the dark bar -->
    <line x1="340" y1="688" x2="340" y2="666" class="err_halo invert" />
    <line x1="320" y1="688" x2="360" y2="688" class="err_halo invert" />
    <line x1="320" y1="666" x2="360" y2="666" class="err_halo invert" />
    <line x1="340" y1="688" x2="340" y2="666" class="err_line sX" />
    <line x1="320" y1="688" x2="360" y2="688" class="err_line sX" />
    <line x1="320" y1="666" x2="360" y2="666" class="err_line sX" />

    <line x1="520" y1="706" x2="520" y2="684" class="err_halo invert" />
    <line x1="500" y1="706" x2="540" y2="706" class="err_halo invert" />
    <line x1="500" y1="684" x2="540" y2="684" class="err_halo invert" />
    <line x1="520" y1="706" x2="520" y2="684" class="err_line sX" />
    <line x1="500" y1="706" x2="540" y2="706" class="err_line sX" />
    <line x1="500" y1="684" x2="540" y2="684" class="err_line sX" />

    <line x1="840" y1="256" x2="840" y2="232" class="err_halo invert" />
    <line x1="820" y1="256" x2="860" y2="256" class="err_halo invert" />
    <line x1="820" y1="232" x2="860" y2="232" class="err_halo invert" />
    <line x1="840" y1="256" x2="840" y2="232" class="err_line sX" />
    <line x1="820" y1="256" x2="860" y2="256" class="err_line sX" />
    <line x1="820" y1="232" x2="860" y2="232" class="err_line sX" />

    <line x1="1020" y1="236" x2="1020" y2="212" class="err_halo invert" />
    <line x1="1000" y1="236" x2="1040" y2="236" class="err_halo invert" />
    <line x1="1000" y1="212" x2="1040" y2="212" class="err_halo invert" />
    <line x1="1020" y1="236" x2="1020" y2="212" class="err_line sX" />
    <line x1="1000" y1="236" x2="1040" y2="236" class="err_line sX" />
    <line x1="1000" y1="212" x2="1040" y2="212" class="err_line sX" />

    <!-- X category labels -->
    <text x="430" y="808" class="center">No oddity</text>
    <text x="930" y="808" class="center">Oddity present</text>

    <!-- Legend -->
    <rect x="710" y="74" width="24" height="24" class="bar1" />
    <text x="746" y="94" class="left">Low activity</text>
    <rect x="964" y="74" width="24" height="24" class="bar2" />
    <text x="1000" y="94" class="left">High activity</text>
</svg>
