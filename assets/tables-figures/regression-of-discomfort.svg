<svg viewBox="0 0 1612 356" width="1612" height="356" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Regression of discomfort</title>
    <desc id="dsc">APA-7 formatted regression table predicting discomfort from oddity, activity (noise), and their interaction, with b, SE, 95% CI, beta, t, p, and sr squared.</desc>

    <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2.5; }
        .thin { stroke-width: 1.5; }
    </style>

    <rect x="0" y="0" width="1612" height="356" rx="32" class="bg" stroke-width="0.002" />

    <!-- Top rule -->
    <line x1="36" y1="36" x2="1576" y2="36" class="thick" />

    <!-- Column headers -->
    <text x="36" y="76" class="left bold">Term</text>
    <text x="506" y="76" class="center bold italic">b</text>
    <text x="636" y="76" class="center bold italic">SE</text>
    <text x="856" y="76" class="center bold">95% CI</text>
    <text x="1076" y="76" class="center bold">&#946;</text>
    <text x="1206" y="76" class="center bold italic">t</text>
    <text x="1356" y="76" class="center bold italic">p</text>
    <text x="1506" y="76" class="center bold"><tspan class="italic">sr</tspan>&#178;</text>

    <!-- Header rule -->
    <line x1="36" y1="96" x2="1576" y2="96" class="thin" />

    <!-- Row 1: Constant -->
    <text x="36" y="134" class="left">Constant</text>
    <text x="506" y="134" class="center">1.475</text>
    <text x="636" y="134" class="center">.038</text>
    <text x="856" y="134" class="center">[1.399, 1.550]</text>
    <text x="1076" y="134" class="center">&#8212;</text>
    <text x="1206" y="134" class="center">38.33</text>
    <text x="1356" y="134" class="center">&lt; .001</text>
    <text x="1506" y="134" class="center">&#8212;</text>

    <!-- Row 2: Oddity -->
    <text x="36" y="190" class="left">Oddity</text>
    <text x="506" y="190" class="center">0.690</text>
    <text x="636" y="190" class="center">.054</text>
    <text x="856" y="190" class="center">[0.584, 0.797]</text>
    <text x="1076" y="190" class="center">.32</text>
    <text x="1206" y="190" class="center">12.69</text>
    <text x="1356" y="190" class="center">&lt; .001</text>
    <text x="1506" y="190" class="center">.051</text>

    <!-- Row 3: Activity (noise) -->
    <text x="36" y="246" class="left">Activity (noise)</text>
    <text x="506" y="246" class="center">0.188</text>
    <text x="636" y="246" class="center">.054</text>
    <text x="856" y="246" class="center">[0.081, 0.294]</text>
    <text x="1076" y="246" class="center">.09</text>
    <text x="1206" y="246" class="center">3.45</text>
    <text x="1356" y="246" class="center">&lt; .001</text>
    <text x="1506" y="246" class="center">.004</text>

    <!-- Row 4: Oddity x Activity -->
    <text x="36" y="302" class="left">Oddity &#215; Activity</text>
    <text x="506" y="302" class="center">0.162</text>
    <text x="636" y="302" class="center">.077</text>
    <text x="856" y="302" class="center">[0.011, 0.313]</text>
    <text x="1076" y="302" class="center">.07</text>
    <text x="1206" y="302" class="center">2.11</text>
    <text x="1356" y="302" class="center">.035</text>
    <text x="1506" y="302" class="center">.001</text>

    <!-- Bottom rule -->
    <line x1="36" y1="320" x2="1576" y2="320" class="thick" />
</svg>
