<svg viewBox="0 0 780 390" width="780" height="390" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Participant flow from recruitment to analysed sample</title>
    <desc id="dsc">Flow diagram: 87 participants recruited, three excluded (two with unprocessed data, one for inattentive responding), leaving 84 participants contributing 2,688 ratings, 672 per condition.</desc>

    <style>
        rect, line, polygon, path { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon, path { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        rect {
            fill: none;
            rx: 8;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .center { text-anchor: middle; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2; }
        .thin { stroke-width: 0.75; }
        .dashed { stroke-dasharray: 8 8; }
        .box { fill: none; stroke-width: 1; }

        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
    </style>

    <defs>
        <marker id="arrow" viewBox="0 0 20 20" refX="19" refY="10"
                markerWidth="14" markerHeight="14" orient="auto-start-reverse">
            <polygon points="0,0 20,10 0,20" style="fill: context-fill; stroke: context-stroke" />
        </marker>
    </defs>

    <rect x="0" y="0" width="780" height="390" rx="16" class="bg" stroke-width="0.001" />

    <!-- Recruited -->
    <rect x="30" y="20" width="400" height="50" rx="6" class="box" />
    <text x="230" y="42" class="center">Recruited via Prolific</text>
    <text x="230" y="62" class="center"><tspan class="italic">n</tspan> = 87</text>
    
    <!-- Data screening -->
    <path d="M 145 105 H 315 L 330 130 L 315 155 H 145 L 130 130 Z" class="box" />
    <text x="230" y="135" class="center">Data screening</text>

    <!-- Connector with exclusion branch -->
    <line x1="230" y1="70" x2="230" y2="104" class="thin s9 f9" marker-end="url(#arrow)" />
    <line x1="230" y1="155" x2="230" y2="196" class="thin s9 f9" marker-end="url(#arrow)" />
    <line x1="330" y1="130" x2="470" y2="130" class="thin dashed s4 f4" marker-end="url(#arrow)" />

    <!-- Exclusions -->
    <rect x="470" y="90" width="280" height="82" rx="6" class="box" />
    <text x="480" y="112" class="left">Excluded (<tspan class="italic">n</tspan> = 3)</text>
    <text x="480" y="134" class="left small">Data not processed by platform (<tspan class="italic">n</tspan> = 2)</text>
    <text x="480" y="154" class="left small">Inattentive responding (<tspan class="italic">n</tspan> = 1)</text>

    <!-- Analysed -->
    <rect x="30" y="198" width="400" height="50" rx="6" class="box" />
    <text x="230" y="220" class="center">Analysed sample</text>
    <text x="230" y="240" class="center"><tspan class="italic">n</tspan> = 84 (45 women, 39 men)</text>
    <line x1="230" y1="248" x2="230" y2="286" class="thin s9 f9" marker-end="url(#arrow)" />

    <!-- Ratings -->
    <rect x="30" y="288" width="400" height="78" rx="6" class="box" />
    <text x="230" y="313" class="center">2,688 ratings analysed</text>
    <text x="230" y="337" class="center small">32 per participant; 672 per condition</text>
    <text x="230" y="355" class="center small">8 per condition per participant</text>
</svg>
