<svg viewBox="0 0 1560 780" width="1560" height="780" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Participant flow from recruitment to analysed sample</title>
    <desc id="dsc">Flow diagram: 87 participants recruited, three excluded (two with unprocessed data, one for inattentive responding), leaving 84 participants contributing 2,688 ratings, 672 per condition.</desc>

    <style>
        rect, line, polygon, path { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon, path { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .center { text-anchor: middle; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 8; }
        .thin { stroke-width: 2.25; }
        .dashed { stroke-dasharray: 8 8; }
        .box { fill: none; stroke-width: 2; }

        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
    </style>

    <defs>
        <marker id="arrow" viewBox="0 0 30 30" refX="27" refY="15"
                markerWidth="10.5" markerHeight="10.5" orient="auto-start-reverse">
            <polygon points="0,0 30,15 0,30" style="fill: context-fill; stroke: context-stroke" />
        </marker>
    </defs>

    <rect x="0" y="0" width="1560" height="780" rx="32" class="bg" stroke-width="0.002" />

    <!-- Recruited -->
    <rect x="60" y="40" width="800" height="100" rx="16" class="box" />
    <text x="460" y="84" class="center">Recruited via Prolific</text>
    <text x="460" y="124" class="center"><tspan class="italic">n</tspan> = 87</text>

    <!-- Data screening -->
    <path d="M 290 210 H 630 L 660 260 L 630 310 H 290 L 260 260 Z" class="box" />
    <text x="460" y="270" class="center">Data screening</text>

    <!-- Connector with exclusion branch -->
    <line x1="460" y1="140" x2="460" y2="208" class="thin s9 f9" marker-end="url(#arrow)" />
    <line x1="460" y1="310" x2="460" y2="392" class="thin s9 f9" marker-end="url(#arrow)" />
    <line x1="660" y1="260" x2="940" y2="260" class="thin dashed s4 f4" marker-end="url(#arrow)" />

    <!-- Exclusions -->
    <rect x="940" y="180" width="560" height="164" rx="16" class="box" />
    <text x="960" y="224" class="left">Excluded (<tspan class="italic">n</tspan> = 3)</text>
    <text x="960" y="268" class="left small">Data not processed by platform (<tspan class="italic">n</tspan> = 2)</text>
    <text x="960" y="308" class="left small">Inattentive responding (<tspan class="italic">n</tspan> = 1)</text>

    <!-- Analysed -->
    <rect x="60" y="396" width="800" height="100" rx="16" class="box" />
    <text x="460" y="440" class="center">Analysed sample</text>
    <text x="460" y="480" class="center"><tspan class="italic">n</tspan> = 84 (45 women, 39 men)</text>
    <line x1="460" y1="496" x2="460" y2="572" class="thin s9 f9" marker-end="url(#arrow)" />

    <!-- Ratings -->
    <rect x="60" y="576" width="800" height="156" rx="16" class="box" />
    <text x="460" y="626" class="center">2,688 ratings analysed</text>
    <text x="460" y="674" class="center small">32 per participant; 672 per condition</text>
    <text x="460" y="710" class="center small">8 per condition per participant</text>

    <!-- Legend / Key -->
    <g style="opacity:0.75">
        <xxx_rect x="1100" y="636" width="400" height="96" class="thin" rx="4" fill="none" />
        <line x1="1146" y1="668" x2="1216" y2="668" marker-end="url(#arrow)" class="thin s9 f9" />
        <line x1="1146" y1="706" x2="1216" y2="706" marker-end="url(#arrow)" class="thin dashed s4 f4" />
        <text x="1230" y="674" class="left f9 small">Proceeded to next stage</text>
        <text x="1230" y="712" class="left f4 small">Excluded from analysis</text>
    </g>
</svg>
