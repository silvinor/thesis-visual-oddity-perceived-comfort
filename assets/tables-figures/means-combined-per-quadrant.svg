<svg viewBox="0 10 920 370" width="920" height="370" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Mean perceived unexpectedness and discomfort by condition</title>
    <desc id="dsc">Two-panel grouped bar chart. Panel A shows mean perceived unexpectedness and Panel B mean discomfort for scenes with and without an oddity, at low and high activity levels, with 95% confidence intervals computed across the 84 participant condition means.</desc>

    <defs>
        <pattern id="dots" class="s3" width="4" height="4" patternUnits="userSpaceOnUse" stroke-width="0">
            <rect x="0" y="0" width="4" height="4" />
            <circle cx="1" cy="1" r=".01" stroke-width="1" />
            <circle cx="3" cy="3" r=".01" stroke-width="1" />
        </pattern>
        <pattern id="hatch" class="sA" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)" stroke-width="0">
            <rect x="0" y="0" width="4" height="4" />
            <line x1="0" y1="0" x2="4" y2="0" stroke-width="2" />
        </pattern>
    </defs>

    <style>
        pattern line,
        pattern circle { 
            stroke: inherit;
        }
        pattern rect {
            fill: #FFF;
        }
        line.invert {
            stroke: #FFF;
        }

        rect, line, polygon, path { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            pattern rect {
                fill: #111;
            }
            line.invert {
                stroke: #111;
            }

            rect, line, polygon, path { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }

        .bar1 { fill: url(#dots); }
        .bar2 { fill: url(#hatch); }
        .grid { stroke-width: .5; opacity: 0.15; }
        .axis { stroke-width: 1.25; }
        .tick { stroke-width: .75; }
        .err_halo { stroke-width: 4.5; }
        .err_line { stroke-width: 1.5; }

        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
        .sX { stroke: #777; } .fX { fill: #777; }
    </style>

    <rect x="0" y="10" width="920" height="370" rx="16" class="bg" stroke-width="0.001" />

    <!-- Legend -->
    <rect x="330" y="30" width="12" height="12" rx="2" class="bar1 s3" />
    <text x="350" y="41" class="left">Low activity</text>
    <rect x="470" y="30" width="12" height="12" rx="2" class="bar2 sA" />
    <text x="490" y="41" class="left">High activity</text>

    <!-- ===== Panel A: Perceived unexpectedness ===== -->
    <text x="34" y="72" class="left bold">A</text>
    <text x="52" y="72" class="left">Perceived unexpectedness</text>
    <text x="83" y="337" class="right">1.0</text>
    <line x1="87" y1="332" x2="92" y2="332" class="tick" /><!-- 1 -->
    <text x="83" y="307" class="right">1.5</text>
    <line x1="87" y1="302" x2="92" y2="302" class="tick" /><!-- 1.5 -->
    <line x1="92" y1="302" x2="432" y2="302" class="grid" /><!-- 1.5 -->
    <text x="83" y="277" class="right">2.0</text>
    <line x1="92" y1="272" x2="432" y2="272" class="grid" /><!-- 2 -->
    <line x1="87" y1="272" x2="92" y2="272" class="tick" /><!-- 2 -->
    <text x="83" y="247" class="right">2.5</text>
    <line x1="92" y1="242" x2="432" y2="242" class="grid" /><!-- 2.5 -->
    <line x1="87" y1="242" x2="92" y2="242" class="tick" /><!-- 2.5 -->
    <text x="83" y="217" class="right">3.0</text>
    <line x1="87" y1="212" x2="92" y2="212" class="tick" /><!-- 3 -->
    <line x1="92" y1="212" x2="432" y2="212" class="grid" /><!-- 3 -->
    <text x="83" y="187" class="right">3.5</text>
    <line x1="87" y1="182" x2="92" y2="182" class="tick" /><!-- 3.5 -->
    <line x1="92" y1="182" x2="432" y2="182" class="grid" /><!-- 3.5 -->
    <text x="83" y="157" class="right">4.0</text>
    <line x1="87" y1="152" x2="92" y2="152" class="tick" /><!-- 4 -->
    <line x1="92" y1="152" x2="432" y2="152" class="grid" /><!-- 4 -->
    <text x="83" y="127" class="right">4.5</text>
    <line x1="87" y1="122" x2="92" y2="122" class="tick" />
    <line x1="92" y1="122" x2="432" y2="122" class="grid" /><!-- 4.5 -->
    <text x="83" y="97" class="right">5.0</text>
    <line x1="87" y1="92" x2="92" y2="92" class="tick" />
    <line x1="92" y1="92" x2="432" y2="92" class="grid" />

    <text class="center" transform="rotate(-90 34 212)" x="34" y="212">Mean rating (1-5)</text>
