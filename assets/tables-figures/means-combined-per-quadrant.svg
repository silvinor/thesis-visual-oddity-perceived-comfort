    <line x1="603" y1="288.8" x2="625" y2="288.8" class="err_line" />
    <path d="M651,332 L651,285.0 Q651,279.0 657,279.0 L707,279.0 Q713,279.0 713,285.0 L713,332 Z" class="bar2 sA" />
