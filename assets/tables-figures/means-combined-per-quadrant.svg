    <line x1="203" y1="303.8" x2="225" y2="303.8" class="err_line" />
    <path d="M279,332 L279,144.7 Q279,138.7 285,138.7 L335,138.7 Q341,138.7 341,144.7 L341,332 Z" class="bar1 s3" />
    <line x1="310" y1="143" x2="310" y2="134" class="err_halo invert" />
    <line x1="299" y1="143" x2="321" y2="143" class="err_halo invert" />
    <line x1="299" y1="134" x2="321" y2="134" class="err_halo invert" />
    <line x1="310" y1="143" x2="310" y2="134" class="err_line" />
    <line x1="299" y1="143" x2="321" y2="143" class="err_line" />
    <line x1="299" y1="134" x2="321" y2="134" class="err_line" />
    <path d="M347,332 L347,137.3 Q347,131.3 353,131.3 L403,131.3 Q409,131.3 409,137.3 L409,332 Z" class="bar2 sA" />
    <line x1="378" y1="135.8" x2="378" y2="126.8" class="err_halo invert" />
    <line x1="367" y1="135.8" x2="389" y2="135.8" class="err_halo invert" />
    <line x1="367" y1="126.8" x2="389" y2="126.8" class="err_halo invert" />
    <line x1="378" y1="135.8" x2="378" y2="126.8" class="err_line" />
    <line x1="367" y1="135.8" x2="389" y2="135.8" class="err_line" />
    <line x1="367" y1="126.8" x2="389" y2="126.8" class="err_line" />
    <text x="180" y="358" class="center">No oddity</text>
    <text x="344" y="358" class="center">Oddity present</text>
    <line x1="92" y1="92" x2="92" y2="332" class="axis" />
    <line x1="92" y1="332" x2="432" y2="332" class="axis" />

    <!-- ===== Panel B: Discomfort ===== -->
    <text x="502" y="72" class="left bold">B</text>
    <text x="520" y="72" class="left">Discomfort</text>
    <line x1="555" y1="332" x2="560" y2="332" class="tick" />
    <text x="551" y="337" class="right">1.0</text>
    <line x1="560" y1="292" x2="900" y2="292" class="grid" />
    <line x1="555" y1="292" x2="560" y2="292" class="tick" />
    <text x="551" y="297" class="right">1.5</text>
    <line x1="560" y1="252" x2="900" y2="252" class="grid" />
