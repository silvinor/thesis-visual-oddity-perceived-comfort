    <text x="551" y="257" class="right">2.0</text>
    <line x1="560" y1="212" x2="900" y2="212" class="grid" />
    <line x1="555" y1="212" x2="560" y2="212" class="tick" />
    <text x="551" y="217" class="right">2.5</text>
    <line x1="560" y1="172" x2="900" y2="172" class="grid" />
    <line x1="555" y1="172" x2="560" y2="172" class="tick" />
    <text x="551" y="177" class="right">3.0</text>
    <line x1="560" y1="132" x2="900" y2="132" class="grid" />
    <line x1="555" y1="132" x2="560" y2="132" class="tick" />
    <text x="551" y="137" class="right">3.5</text>
    <line x1="560" y1="92" x2="900" y2="92" class="grid" />
    <line x1="555" y1="92" x2="560" y2="92" class="tick" />
    <text x="551" y="97" class="right">4.0</text>
    <text class="center" transform="rotate(-90 502 212)" x="502" y="212">Mean rating (1-4)</text>
