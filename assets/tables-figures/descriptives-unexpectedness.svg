<svg viewBox="0 0 880 163" width="880" height="163" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <title id="ttl">Perceived unexpectedness by condition</title>
    <desc id="dsc">APA-7 formatted table of means, standard deviations and participant-level 95% confidence intervals for perceived unexpectedness in each of the four experimental conditions.</desc>

    <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .right { text-anchor: end; }
        .center { text-anchor: middle; }
        .small { font-size: 9pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 1.25; }
        .thin { stroke-width: 0.75; }
    </style>

    <rect x="0" y="0" width="880" height="163" rx="16" class="bg" stroke-width="0.001" />

    <!-- Top rule -->
    <line x1="18" y1="18" x2="862" y2="18" class="thick" />

    <!-- Group headers -->
    <text x="330" y="38" class="center bold">No oddity</text>
    <text x="692" y="38" class="center bold">Oddity</text>
    <line x1="180" y1="48" x2="510" y2="48" class="thin" />
    <line x1="540" y1="48" x2="852" y2="48" class="thin" />

    <!-- Sub-column headers -->
    <text x="18" y="68" class="left bold">Activity (noise)</text>
    <text x="218" y="68" class="center bold italic">M</text>
    <text x="312" y="68" class="center bold italic">SD</text>
    <text x="430" y="68" class="center bold">95% CI</text>
    <text x="580" y="68" class="center bold italic">M</text>
    <text x="674" y="68" class="center bold italic">SD</text>
    <text x="792" y="68" class="center bold">95% CI</text>
    <line x1="18" y1="78" x2="862" y2="78" class="thick" />

    <!-- Rows: Unexpectedness -->
    <text x="18" y="106" class="left">Low</text>
    <text x="218" y="106" class="center">1.52</text>
    <text x="312" y="106" class="center">0.90</text>
    <text x="430" y="106" class="center">[1.41, 1.62]</text>
    <text x="580" y="106" class="center">4.22</text>
    <text x="674" y="106" class="center">0.98</text>
    <text x="792" y="106" class="center">[4.11, 4.33]</text>
    <text x="18" y="134" class="left">High</text>
    <text x="218" y="134" class="center">1.41</text>
    <text x="312" y="134" class="center">0.84</text>
    <text x="430" y="134" class="center">[1.29, 1.53]</text>
    <text x="580" y="134" class="center">4.35</text>
    <text x="674" y="134" class="center">1.02</text>
    <text x="792" y="134" class="center">[4.24, 4.45]</text>

    <!-- Bottom rule -->
    <line x1="18" y1="145" x2="862" y2="145" class="thick" />
</svg>
