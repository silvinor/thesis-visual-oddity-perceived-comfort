<svg viewBox="0 0 1600 672" width="1600" height="672" xmlns="http://www.w3.org/2000/svg">
  <title id="ttl">Mediation paths from oddity to discomfort</title>

  <style>
        rect, line, polygon, .s0 { stroke: #111; }
        polygon, text, .f0 { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon, .s0 { stroke: #ddd; }
            polygon, text, .f0 { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        rect {
            fill: none;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 4; }
        .thin { stroke-width: 1.5; }
        .dashed { stroke-dasharray: 16 16; }
        .dotted { stroke-dasharray: 4 9; }

        .fn { fill: none; }
        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 20,10 0,20" style="fill: context-fill; stroke: context-stroke" />
    </marker>
    <!-- same arrowhead, filled from the stroke colour (the a×b path itself has no fill) -->
    <marker id="arrow-axb" viewBox="0 0 20 20" refX="18" refY="10"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 20,10 0,20" style="fill: context-stroke; stroke: context-stroke" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="672" rx="32" stroke-width="0.002" class="bg" />

  <!-- boxes -->
  <g class="thin">
    <rect x="518" y="36" width="312" height="116" rx="16" />
    <rect x="36" y="520" width="312" height="116" rx="16" />
    <rect x="1000" y="520" width="312" height="116" rx="16" />
  </g>

  <!-- Lines -->
  <g class="thick">
    <line x1="192" y1="512" x2="398.4" y2="284" class="s8 f8" />
    <line x1="471" y1="204" x2="518" y2="152" marker-end="url(#arrow)" class="s8 f8" />
    <line x1="830" y1="152" x2="877" y2="204" class="s8 f8" />
    <line x1="949.6" y1="284" x2="1156" y2="512" marker-end="url(#arrow)" class="s8 f8" />
    <line x1="356" y1="580" x2="992" y2="580" marker-end="url(#arrow)" class="dashed s3 f3" />
    <!-- indirect effect (a×b): dotted and thinner, so it reads as the product of a and b rather
    than a third regression path -->
    <path d="M 260 512 C 304 441, 400 401, 674 401 C 948 401, 1044 441, 1088 512"
      marker-end="url(#arrow)" class="dotted s8 fn" />
  </g>

  <!-- parenthesis -->
  <g>
    <circle cx="980" cy="435" r="24" fill="none" class="thin s0" />
    <line x1="998" y1="420" x2="1045" y2="397" class="thin s0" />
    <line x1="1057" y1="391" x2="1120" y2="360" class="thin s0" />

    <line x1="1140" y1="290" x2="1130" y2="290" class="thin s0" />
    <line x1="1130" y1="290" x2="1130" y2="350" class="thin s0" />
    <line x1="1130" y1="350" x2="1120" y2="360" class="thin s0" />
    <line x1="1120" y1="360" x2="1130" y2="370" class="thin s0" />
    <line x1="1130" y1="370" x2="1130" y2="425" class="thin s0" />
    <line x1="1130" y1="425" x2="1140" y2="425" class="thin s0" />
  </g>

  <g>
    <!-- In box text -->
    <text x="674" y="86" class="center bold"> Unexpectedness </text>
    <text x="674" y="120" class="center small"> higher = more unexpected </text>
    <text x="192" y="570" class="center bold"> Oddity </text>
    <text x="192" y="604" class="center small"> present vs absent </text>
    <text x="1156" y="570" class="center bold"> Discomfort </text>
    <text x="1156" y="604" class="center small"> higher = more discomfort </text>

    <!-- Arrow text -->
    <text x="458" y="236" class="center bold f8"><tspan class="italic">a</tspan>: <tspan
        class="italic">B</tspan> = +2.821, <tspan class="italic">p</tspan> &lt; .001 </text>
    <text x="458" y="272" class="center italic small f8">more unexpected</text>
    <text x="890" y="236" class="center bold f8"><tspan class="italic">b</tspan>: <tspan
        class="italic">B</tspan> = +0.412, <tspan class="italic">p</tspan> &lt; .001 </text>
    <text x="890" y="272" class="center italic small f8">more discomfort</text>

    <text x="674" y="560" class="center bold f3"><tspan class="italic">c&#8242;</tspan>: <tspan
        class="italic">B</tspan> = &#8722;0.391, <tspan class="italic">p</tspan> &lt; .001 </text>
    <text x="674" y="612" class="center small f3"> controlling for perceived unexpectedness </text>
    <text x="674" y="640" class="center small italic f3"> less discomfort </text>
  </g>

  <!-- Descriptives -->
  <g>
    <text x="1150" y="330" class="f8">
      <tspan> indirect </tspan>
      <tspan class=""> (<tspan class="italic">a&#x00D7;b</tspan>) = +1.162 </tspan>
    </text>
    <text x="1150" y="370" class="f8">
      <tspan class="f0"> + </tspan>
      <tspan class="f3"> direct </tspan>
      <tspan class="f3"> (<tspan class="italic">c&#8242;</tspan>) = &#8722;0.391 </tspan>
    </text>
    <text x="1150" y="410" class="f8">
      <tspan class="f0"> = </tspan>
      <tspan class="bold"> total </tspan>
      <tspan class="bold"> (<tspan class="italic">c</tspan>) = +0.772, <tspan class="italic">p</tspan>
        &lt; .001 </tspan>
    </text>
  </g>

  <!-- Legend / Key -->
  <g style="opacity:0.75">
    <xxx_rect x="1150" y="36" width="386" height="116" rx="4" class="thin" />
    <line x1="1196" y1="66" x2="1266" y2="66" marker-end="url(#arrow)" class="thick s8 f8" />
    <line x1="1196" y1="96" x2="1266" y2="96" marker-end="url(#arrow)" class="thick dashed s3 f3" />
    <line x1="1196" y1="126" x2="1266" y2="126" marker-end="url(#arrow)" class="thick dotted s8 fn" />
    <text x="1280" y="72" class="left f8 small">Positive association</text>
    <text x="1280" y="102" class="left f3 small">Negative association</text>
    <text x="1280" y="132" class="left f8 small">Indirect effect</text>
  </g>
</svg>