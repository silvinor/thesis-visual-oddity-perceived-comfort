<svg viewBox="0 0 1612 412" width="1612" height="412" xmlns="http://www.w3.org/2000/svg" role="img">
    <title id="ttl">Mediation paths</title>
    <desc id="dsc">APA-7 formatted table of mediation path effects (a, b, c, c-prime, ab) with SE and 95% CI for the oddity to discomfort model via unexpectedness.</desc>

    <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .bold { font-weight: bold; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 2.5; }
        .thin { stroke-width: 1.5; }
    </style>

    <rect x="0" y="0" width="1612" height="412" rx="32" class="bg" stroke-width="0.002" />

    <!-- Top rule -->
    <line x1="36" y1="36" x2="1576" y2="36" class="thick" />

    <!-- Column headers -->
    <text x="36" y="76" class="left bold">Path</text>
    <text x="910" y="76" class="center bold">Effect</text>
    <text x="1110" y="76" class="center bold italic">SE</text>
    <text x="1398" y="76" class="center bold">95% CI</text>

    <!-- Header rule -->
    <line x1="36" y1="96" x2="1576" y2="96" class="thin" />

    <!-- Row 1: a -->
    <text x="36" y="134" class="left"><tspan class="italic">a</tspan> &#8212; oddity &#8594; unexpectedness</text>
    <text x="910" y="134" class="center">2.821</text>
    <text x="1110" y="134" class="center">.036</text>
    <text x="1398" y="134" class="center">[2.750, 2.892]</text>

    <!-- Row 2: b -->
    <text x="36" y="190" class="left"><tspan class="italic">b</tspan> &#8212; unexpectedness &#8594; discomfort</text>
    <text x="910" y="190" class="center">0.412</text>
    <text x="1110" y="190" class="center">.019</text>
    <text x="1398" y="190" class="center">[0.375, 0.449]</text>

    <!-- Row 3: c -->
    <text x="36" y="246" class="left"><tspan class="italic">c</tspan> &#8212; total effect of oddity</text>
    <text x="910" y="246" class="center">0.772</text>
    <text x="1110" y="246" class="center">.039</text>
    <text x="1398" y="246" class="center">[0.696, 0.847]</text>

    <!-- Row 4: c' -->
    <text x="36" y="302" class="left"><tspan class="italic">c&#8242;</tspan> &#8212; direct effect of oddity</text>
    <text x="910" y="302" class="center">&#8722;0.391</text>
    <text x="1110" y="302" class="center">.061</text>
    <text x="1398" y="302" class="center">[&#8722;0.511, &#8722;0.271]</text>

    <!-- Row 5: ab -->
    <text x="36" y="358" class="left"><tspan class="italic">a&#x00D7;b</tspan> &#8212; indirect effect</text>
    <text x="910" y="358" class="center">1.162</text>
    <text x="1110" y="358" class="center">.056</text>
    <text x="1398" y="358" class="center">[1.052, 1.275]</text>

    <!-- Bottom rule -->
    <line x1="36" y1="376" x2="1576" y2="376" class="thick" />
</svg>
