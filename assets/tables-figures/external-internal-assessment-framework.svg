<svg viewBox="0 0 1612 456" width="1612" height="456" xmlns="http://www.w3.org/2000/svg" role="img">
  <title id="ttl">External and internal assessment applied to visual oddity</title>
  <desc id="dsc">A scene containing an out-of-place element is read by the observer as unexpected
    (external assessment), which in turn shapes the emotional response to the scene (internal
    assessment), measured here as self-reported comfort.</desc>

  <style>
        rect, line, polygon { stroke: #111; }
        polygon, text { fill: #111; }

        @media (prefers-color-scheme: dark) {
            rect, line, polygon { stroke: #ddd; }
            polygon, text { fill: #ddd; }
        }

        text {
            font-family: "Times New Roman", Times, serif;
            font-size: 24pt;
        }
        line {
            stroke-linecap: round;
            stroke-linejoin: miter;
        }
        .italic { font-style: italic; }
        .left { text-anchor: start; }
        .center { text-anchor: middle; }
        .small { font-size: 18pt; }
        .bg { fill: transparent; }

        .thick { stroke-width: 4; }
        .thin { stroke-width: 1.5; }
        .dashed { stroke-dasharray: 16 16; }

        .s1 { stroke: #817; } .f1 { fill: #817; }
        .s2 { stroke: #a35; } .f2 { fill: #a35; }
        .s3 { stroke: #c66; } .f3 { fill: #c66; }
        .s4 { stroke: #e94; } .f4 { fill: #e94; }
        .s5 { stroke: #ed0; } .f5 { fill: #ed0; }
        .s6 { stroke: #9d5; } .f6 { fill: #9d5; }
        .s7 { stroke: #4d8; } .f7 { fill: #4d8; }
        .s8 { stroke: #2cb; } .f8 { fill: #2cb; }
        .s9 { stroke: #0bc; } .f9 { fill: #0bc; }
        .sA { stroke: #09c; } .fA { fill: #09c; }
        .sB { stroke: #36b; } .fB { fill: #36b; }
        .sC { stroke: #639; } .fC { fill: #639; }
    </style>
  <defs>
    <marker id="arrow" viewBox="0 0 20 20" refX="18" refY="10"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 20,10 0,20" style="fill: context-fill; stroke: context-stroke" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1612" height="456" stroke-width="0.002" class="bg" />

  <!-- Stimulus -->
  <rect class="thin" x="32" y="164" width="352" height="128" rx="16" fill="none" />
  <text class="center" x="208" y="216">Scene with an</text>
  <text class="center" x="208" y="260">out-of-place element</text>

  <!-- External assessment -->
  <rect class="thin" x="576" y="36" width="400" height="128" rx="16" fill="none" />
  <text class="center italic" x="776" y="88">External assessment</text>
  <text class="center small" x="776" y="132">Perceived unexpectedness</text>

  <!-- Internal assessment -->
  <rect class="thin" x="576" y="292" width="400" height="128" rx="16" fill="none" />
  <text class="center italic" x="776" y="344">Internal assessment</text>
  <text class="center small" x="776" y="388">Affective response</text>

  <!-- Outcome -->
  <rect class="thin" x="1168" y="292" width="412" height="128" rx="16" fill="none" />
  <text class="center" x="1374" y="344">Self-reported discomfort</text>
  <text class="center small" x="1374" y="388">Five-point scale</text>

  <!-- Stimulus to external -->
  <line class="thick s9 f9" x1="390" y1="212" x2="570" y2="108" marker-end="url(#arrow)" />

  <!-- Stimulus to internal (direct path) -->
  <line class="thick dashed s4 f4" x1="390" y1="248" x2="570" y2="352" marker-end="url(#arrow)" />

  <!-- External to internal -->
  <line class="thick s9 f9" x1="776" y1="170" x2="776" y2="284" marker-end="url(#arrow)" />

  <!-- Internal to outcome -->
  <line class="thick s4 f4" x1="982" y1="356" x2="1162" y2="356" marker-end="url(#arrow)" />

  <text class="small center" x="464" y="88">reads as</text>
  <text class="small center" x="464" y="116">incongruent</text>
  <text class="small center" x="828" y="236">shapes</text>
  <text class="small center" x="444" y="356">direct affective</text>
  <text class="small center" x="444" y="384">route</text>

  <!-- Legend / Key -->
  <g style="opacity:0.75">
    <xxx_rect x="1150" y="36" width="430" height="116" class="thin" rx="4" fill="none" />
    <line x1="1196" y1="66" x2="1266" y2="66" marker-end="url(#arrow)" class="thick s9 f9" />
    <line x1="1196" y1="96" x2="1266" y2="96" marker-end="url(#arrow)" class="thick dashed s4 f4" />
    <line x1="1196" y1="126" x2="1266" y2="126" marker-end="url(#arrow)" class="thick s4 f4" />
    <text x="1280" y="72" class="left f9 small">Via external assessment</text>
    <text x="1280" y="102" class="left f4 small">Direct affective route</text>
    <text x="1280" y="132" class="left f4 small">Measured by self-report</text>
  </g>
</svg>
